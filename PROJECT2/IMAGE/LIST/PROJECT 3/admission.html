<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissionform</title>
</head>
<body>
    <h2>Student Admission Form</h2>
    <form action="#" method="post">
        <label for="name">Father Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="mname">Mother Name:</label>
        <input type="text" id="mname" name="mname" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

         <label for="mobile">Mobile:</label>
        <input type="mobile" id="mobile" name="mobile" required><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="computer science">Computer Science</option>
            <option value="business administration">Civil Engineering</option>
            <option value="engineering">Mechanical Engineering</option>
            <option value="medicine">Doctor of Heart Surgery</option>
        </select><br><br>

        <input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

<input type="checkbox"> Earning Money
<input type="checkbox"> Swmming
<input type="checkbox"> Cricket
<input type="checkbox"> Trading
<input type="checkbox"> Batminton
<input type="checkbox"> Music
<br><br>




        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
     Adress:
        <textarea rows="4" cols="30"></textarea>
    <br><br>

City:
<select>
<option>Nagpur</option>
<option>Pune</option>
<option>Mumbai</option>
</select>
<br><br>
<input type="submit" value="Register">
<input type="reset" value="Reset">

<label for="date of birth">Date of Birth:</label>
<input type="date" id="date of birth" name="date of birth" required>

    </form>

</body>
</html>
